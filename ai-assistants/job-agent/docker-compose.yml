services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data              # база, резюме, сесії, скріншоти — живуть поза контейнером
      - ./config.yaml:/app/config.yaml:ro
    shm_size: "512mb"                  # для Chromium
    logging:
      options: { max-size: "10m", max-file: "3" }
